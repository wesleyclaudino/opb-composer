services:
  db:
    image: postgres:17.4
    container_name: opb-postgres
    env_file:
      - application-dev.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - spring-net

  app:
    build: .
    container_name: opb-server
    ports:
      - "8080:8080"
    depends_on:
      - db
    env_file:
      - application-dev.env
    networks:
      - spring-net

volumes:
  postgres_data:

networks:
  spring-net:
